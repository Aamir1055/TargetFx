name: Build and deploy BrokerEye
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test src/utils/*.test.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      vars.WINDOWS_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64, brokereye-production]
    environment: production
    concurrency:
      group: brokereye-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release-dist
      - name: Deploy selected frontend files
        shell: powershell
        run: >-
          & .\scripts\Deploy-Frontend.ps1
          -SourcePath "$env:GITHUB_WORKSPACE\release-dist"
          -DestinationPath 'C:\xampp\htdocs'
          -BackupRoot 'C:\xampp\brokereye-deploy-backups'
